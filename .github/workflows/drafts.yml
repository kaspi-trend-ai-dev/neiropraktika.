name: Generate SEO draft for review
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate next draft
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: node scripts/draft.mjs
      - name: Review pending drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: gpt-4.1-mini
        run: node scripts/review-drafts.mjs
      - name: Audit new claims against live official documentation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_FACT_MODEL: gpt-4.1-mini
        run: node scripts/fact-check.mjs
      - name: Build approved pages
        run: node scripts/publish-approved.mjs
      - name: Verify output before publication
        run: node scripts/check-publication.mjs
      - name: Save generated content
        run: |
          git add -A -- drafts articles.json reports/fact-check.json reports/FACT-STATUS.md
          if [ -d articles ]; then git add -A -- articles; fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Generate, review and publish SEO tutorial"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
