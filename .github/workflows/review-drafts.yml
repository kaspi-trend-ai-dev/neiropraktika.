name: Review pending SEO drafts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/review-drafts.mjs
      - name: Save review decisions
        run: |
          if [ -n "$(git status --porcelain -- drafts/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add drafts/
            git commit -m "Review draft structure and topic overlap"
            git push
          fi
