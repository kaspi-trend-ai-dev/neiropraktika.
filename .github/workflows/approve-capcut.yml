name: Approve CapCut tutorial after editorial review
on:
  workflow_dispatch:
    inputs:
      attestation:
        description: 'Only after reading the article and the official source, confirm ПРОВЕРЕНО'
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: capcut-editorial-approval
  cancel-in-progress: false
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record human approval and verify current official CapCut documentation
        env:
          REVIEWED_SLUG: capcut-subtitles-reels
          REVIEW_ATTESTATION: ${{ inputs.attestation }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_FACT_MODEL: gpt-4.1-mini
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/fact-check.mjs "--slug=$REVIEWED_SLUG"
            node scripts/approve-reviewed.mjs
            git add "drafts/$REVIEWED_SLUG.json" reports/fact-check.json reports/FACT-STATUS.md
            git commit -m "Human-approved CapCut tutorial with current source evidence"
            if git push origin HEAD:main; then
              echo "Attestation recorded; publication workflow will render the approved article."
              exit 0
            fi
            sleep "$((2 * attempt))"
          done
          echo "main changed too often. No approval saved; retry the workflow." >&2
          exit 1
      - name: Keep evidence available even when approval fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-review-fact-evidence
          path: |
            reports/fact-check.json
            reports/FACT-STATUS.md
