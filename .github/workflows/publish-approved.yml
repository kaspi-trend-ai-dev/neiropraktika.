name: Publish approved articles
on:
  push:
    branches: [main]
    paths:
      - 'drafts/**'
      - 'scripts/publish-approved.mjs'
      - '.github/workflows/publish-approved.yml'
  workflow_run:
    workflows: ['Approve CapCut tutorial after editorial review']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: neiropraktika-approved-builder
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, verify and safely save approved pages
        run: bash scripts/publish-safely.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy updated website
        id: deployment
        uses: actions/deploy-pages@v4
