name: Publish approved articles
on:
  push:
    branches: [main]
    paths:
      - 'drafts/**'
      - 'scripts/publish-approved.mjs'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build approved articles
        run: node scripts/publish-approved.mjs
      - name: Commit approved pages
        run: |
          git add -A -- articles.json
          if [ -d articles ]; then git add -A -- articles; fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish reviewed tutorials"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy updated website
        id: deployment
        uses: actions/deploy-pages@v4
