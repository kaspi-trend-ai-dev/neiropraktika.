name: Content quality audit
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: neiropraktika-report-writes
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-content.mjs
      - name: Save audit report in repository
        run: bash scripts/push-report-safely.sh 'Update content audit report' reports/content-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neiropraktika-content-audit
          path: reports/content-audit.json
