name: Content quality audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-content.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: neiropraktika-content-audit
          path: reports/content-audit.json
