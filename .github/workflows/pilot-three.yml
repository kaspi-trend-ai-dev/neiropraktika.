name: Three practical tutorials pilot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pilot-three.yml'
      - 'scripts/pilot-three.mjs'
      - 'drafts/freelance-ai-portfolio.json'
      - 'drafts/shorts-interview-ai.json'
      - 'drafts/chatgpt-kartinki.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pilot code
        run: node --check scripts/pilot-three.mjs
      - name: Review three practical articles without publishing
        run: node scripts/pilot-three.mjs
      - name: Save pilot report
        run: |
          git add reports/pilot-three.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update practical tutorials pilot status"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: three-tutorials-pilot-report
          path: reports/pilot-three.json
