name: Three practical tutorials pilot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pilot-three.yml'
      - 'scripts/pilot-three.mjs'
      - 'drafts/freelance-ai-portfolio.json'
      - 'drafts/shorts-interview-ai.json'
      - 'drafts/chatgpt-kartinki.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: neiropraktika-report-writes
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pilot code
        run: node --check scripts/pilot-three.mjs
      - name: Review three practical articles without publishing
        run: node scripts/pilot-three.mjs
      - name: Save pilot report
        run: bash scripts/push-report-safely.sh 'Update practical tutorials pilot status' reports/pilot-three.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-tutorials-pilot-report
          path: reports/pilot-three.json
